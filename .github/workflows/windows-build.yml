name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single EXE (x64)
        shell: pwsh
        run: |
          dotnet publish BareRec.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PlatformTarget=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item publish/BareRec.exe -ErrorAction Stop
          Write-Host "BareRec.exe size: $([math]::Round($exe.Length / 1MB, 2)) MiB"
      - name: Upload only executable
        uses: actions/upload-artifact@v4
        with:
          name: BareRec-Single-EXE
          path: publish/BareRec.exe
          if-no-files-found: error
