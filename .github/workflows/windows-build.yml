name: Build BareRec Native Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  native-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native static-runtime EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          cl /nologo /std:c++20 /O2 /EHsc /W4 /DUNICODE /D_UNICODE /MT /Fe:publish\BareRec.exe native\main.cpp /link /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item publish/BareRec.exe -ErrorAction Stop
          Write-Host "Native BareRec EXE size: $([math]::Round($exe.Length / 1MB, 3)) MiB"
          if ($exe.Length -gt 10MB) { throw "Native executable exceeds 10 MiB target" }
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: BareRec-Native-EXE
          path: publish/BareRec.exe
          if-no-files-found: error
