name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish x64 app with native recording dependencies
        shell: pwsh
        run: |
          dotnet clean BareRec.csproj -c Release -p:Platform=x64
          dotnet publish BareRec.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PlatformTarget=x64 -p:PublishSingleFile=false -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path publish/BareRec.exe)) { throw "BareRec.exe missing" }
          if (!(Test-Path publish/ScreenRecorderLib.dll)) { throw "ScreenRecorderLib.dll missing from publish output" }
          Get-ChildItem publish | Select-Object Name,Length
      - name: Upload complete application (keep all DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: BareRec-Windows-x64
          path: publish/
          if-no-files-found: error
